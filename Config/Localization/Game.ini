; Configuracion del destino de localizacion "Game" (RNF-6.1, RNF-6.2).
;
; Genera el manifiesto a partir de los LOCTEXT del codigo C++ y de los textos
; de los assets. Se ejecuta con:
;
;   UnrealEditor-Cmd.exe <proyecto>.uproject -run=GatherText
;       -config="Config/Localization/Game.ini"
;
; El espanol es la cultura nativa: los LOCTEXT del codigo estan en espanol, asi
; que no necesita archivo de traduccion propio.

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=es
CulturesToGenerate=es
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source
SearchDirectoryPaths=Config
ExcludePathFilters=Source/*/Private/Tests/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/Developers/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest
ManifestDependencies=

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource
ResourceName=Game.locres
